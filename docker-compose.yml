services:
  wilab:
    image: ghcr.io/wiggo-dev/wilab:latest
    # build: .  # use local Dockerfile instead of pulling from GHCR
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      WILAB_DATA_DIR: /data
      # WILAB_ACCESS_TOKEN: "replace-me"  # optional shared-secret gate
    restart: unless-stopped
